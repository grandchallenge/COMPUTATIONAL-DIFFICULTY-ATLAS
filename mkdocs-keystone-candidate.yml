site_name: A Mathematical Atlas of Computational Difficulty — editorial acceptance candidate
docs_dir: build/docs
site_dir: build/site
theme:
  name: mkdocs
markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
strict: true
