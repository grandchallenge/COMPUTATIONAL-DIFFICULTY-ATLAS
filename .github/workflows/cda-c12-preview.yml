name: CDA C12 time space hierarchy review
on:
  pull_request:
    paths:
      - 'chapters/C12.md'
      - 'tests/test_c12_hierarchy.py'
      - 'mkdocs-c12-preview.yml'
      - '.github/workflows/cda-c12-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c12-qbf-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
      - name: Exhaustive three-variable resource witness falsification
        run: python -m unittest tests.test_c12_hierarchy -v
      - name: Install pinned MathJax-aware preview
        run: python -m pip install 'mkdocs==1.6.1' 'pymdown-extensions==10.16.1'
      - name: Stage nonpublic C12 source
        shell: bash
        run: |
          mkdir -p build/c12-docs/chapters
          cp chapters/C12.md build/c12-docs/chapters/
          printf '# C12 Mathematical Review\n\n**UNACCEPTED MATHEMATICAL EDITORIAL CANDIDATE; NOT PUBLIC.**\n\n[Read C12](chapters/C12.md)\n' > build/c12-docs/index.md
      - name: Strict mathematical HTML render
        run: mkdocs build --strict -f mkdocs-c12-preview.yml
      - name: Inspect equation formatting and scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('build/c12-site/chapters/C12/index.html').read_text()
          home=Path('build/c12-site/index.html').read_text()
          assert 'arithmatex' in html and 'mathjax' in html.lower()
          assert 'EXPSPACE' in html and 'PSPACE' in html and 'Exercises' in html
          assert 'UNACCEPTED MATHEMATICAL EDITORIAL' in home
          assert 'EXPTIME' in html and '2EXPTIME' in html
          print('C12 exact mathematical source and strict MkDocs review PASS')
          PY
      - name: Preserve exact-head archive metadata
        shell: bash
        run: |
          printf 'source_commit=%s\n' "$(git rev-parse HEAD)" > build/c12-site/SOURCE_COMMIT.txt
          printf 'status=UNACCEPTED_MATHEMATICAL_EDITORIAL\n' >> build/c12-site/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cda-c12-hierarchy-math-review
          path: build/c12-site/
          retention-days: 14
          if-no-files-found: error
