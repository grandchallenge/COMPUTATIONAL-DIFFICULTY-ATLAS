name: CDA C06 mathematical and typesetting preview
on:
  pull_request:
    paths:
      - 'chapters/C06.md'
      - 'tests/test_c06_reduction.py'
      - 'ci/stage_c06_preview.py'
      - 'ci/check_c06_preview.py'
      - 'mkdocs-c06-preview.yml'
      - '.github/workflows/cda-c06-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c06-math-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
      - name: Test Tseitin gate equivalence and 3SAT-to-CLIQUE reduction instances
        run: python -m unittest tests.test_c06_reduction -v
      - name: Install exact math renderer
        run: python -m pip install 'mkdocs==1.6.1' 'pymdown-extensions==10.16.1'
      - name: Stage unaccepted chapter C06
        run: python ci/stage_c06_preview.py
      - name: Strict MathJax HTML build
        run: mkdocs build --strict -f mkdocs-c06-preview.yml
      - name: Check HTML claims and math spans
        run: python ci/check_c06_preview.py
      - name: Record exact source head for reviewer
        shell: bash
        run: |
          printf 'source_commit=%s\n' "$(git rev-parse HEAD)" > build/c06-site/SOURCE_COMMIT.txt
          printf 'status=UNACCEPTED_EDITORIAL_CANDIDATE\n' >> build/c06-site/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cda-c06-unaccepted-math-review-html
          path: build/c06-site/
          retention-days: 14
          if-no-files-found: error
