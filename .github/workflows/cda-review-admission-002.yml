name: CDA review admission 002 — protected only
on:
  pull_request:
    paths:
      - 'governance/CDA_REVIEW_ADMISSION_002.json'
      - 'ci/cda_review_job_admission.py'
      - 'tests/test_cda_review_admission.py'
      - '.github/workflows/cda-review-admission-002.yml'
  push:
    branches: [main]
    paths:
      - 'governance/CDA_REVIEW_ADMISSION_002.json'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: cda-review-admission-002
  cancel-in-progress: false
jobs:
  review-job-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
      - name: Adversarial admission invariant tests
        run: python -m unittest tests.test_cda_review_admission -v
      - name: Check six immutable issue/PR/field bindings without mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/cda_review_job_admission.py
      - name: Admit only after protected main transition
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/cda_review_job_admission.py --execute
