name: CDA direct editorial returns

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  project-return:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, 'RESULT/1')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: cda-direct-return-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Read operational fields
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/issue-field-values" \
            > "$RUNNER_TEMP/issue-fields.json"

      - name: Evaluate direct-return projection
        run: |
          python ci/cda_direct_return_projector.py \
            --event "$GITHUB_EVENT_PATH" \
            --issue-fields "$RUNNER_TEMP/issue-fields.json" \
            --output "$RUNNER_TEMP/projection.json"
          cat "$RUNNER_TEMP/projection.json"

      - name: Reconcile operational RETURNED state
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$(jq -r '.project' "$RUNNER_TEMP/projection.json")" != true ]; then
            exit 0
          fi

          # Receipt projection only: RESULT/1 remains unadjudicated evidence.
          printf '%s\n' '{"issue_field_values":[{"field_id":47953501,"value":"RETURNED"}]}' \
            > "$RUNNER_TEMP/state-update.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/issue-field-values" \
            --input "$RUNNER_TEMP/state-update.json" > /dev/null

          gh label create "gcl-state:returned" --repo "$GITHUB_REPOSITORY" \
            --color "6f42c1" --description "Direct worker result returned; not yet adjudicated" \
            --force > /dev/null
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --add-label "gcl-state:returned" > /dev/null
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label "gcl-state:available" > /dev/null 2>&1 || true

          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/issue-field-values" \
            > "$RUNNER_TEMP/readback.json"
          jq -e 'any(.[]; .issue_field_name=="GCL State" and .single_select_option.name=="RETURNED")' \
            "$RUNNER_TEMP/readback.json" > /dev/null

          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels \
            > "$RUNNER_TEMP/issue-readback.json"
          jq -e '
            ([.labels[].name] | index("gcl-state:returned")) != null and
            ([.labels[].name] | index("gcl-state:available")) == null
          ' "$RUNNER_TEMP/issue-readback.json" > /dev/null
