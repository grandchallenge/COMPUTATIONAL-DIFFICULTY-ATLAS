name: CDA operational checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  direct-return-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - name: Test direct-return projector and replay watchdog
        run: |
          python -m unittest tests.test_cda_direct_return_projector tests.test_cda_direct_return_reconcile tests.test_cda_return_replay_entrypoint -v
      - name: Validate adjudicated review provenance
        run: python ci/validate_review_provenance.py
